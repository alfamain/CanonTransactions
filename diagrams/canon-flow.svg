<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Canon Transactions ledger spread</title><desc id="desc">An append-only evidence ledger is resolved into a current canonical state with conflicts and revocations preserved.</desc>
<rect width="1200" height="520" fill="#F5EFE4"/><path d="M600 48V470" stroke="#D5C6AD" stroke-width="3"/><text x="70" y="72" fill="#243247" font-family="Georgia,serif" font-size="31" font-weight="700">Canon Transactions</text><text x="70" y="102" fill="#776B5A" font-family="Arial,sans-serif" font-size="15">AN APPEND-ONLY LEDGER — CURRENT TRUTH IS RESOLVED, NOT RETRIEVED BY RANK</text>
<g font-family="Arial,sans-serif"><text x="70" y="158" fill="#80612C" font-size="13" font-weight="700">EVENT LEDGER</text><path d="M133 187V424" stroke="#8998A8" stroke-width="3"/>
<g><circle cx="133" cy="208" r="12" fill="#38617E"/><rect x="164" y="177" width="340" height="62" rx="8" fill="#DCE8EF"/><text x="187" y="203" fill="#1E3B50" font-size="16" font-weight="700">01  CLAIM</text><text x="187" y="225" fill="#426176" font-size="13">evidence-backed assertion enters the ledger</text></g>
<g><circle cx="133" cy="286" r="12" fill="#BC7A22"/><rect x="164" y="255" width="340" height="62" rx="8" fill="#F2E2C9"/><text x="187" y="281" fill="#704714" font-size="16" font-weight="700">02  CORRECTION</text><text x="187" y="303" fill="#855D2A" font-size="13">explicitly supersedes the older event</text></g>
<g><circle cx="133" cy="364" r="12" fill="#8C3D61"/><rect x="164" y="333" width="340" height="62" rx="8" fill="#F2DCE5"/><text x="187" y="359" fill="#5C1F3C" font-size="16" font-weight="700">03  CONFLICT / REVOKE</text><text x="187" y="381" fill="#7C4160" font-size="13">preserved, named, never silently overwritten</text></g>
<text x="670" y="158" fill="#80612C" font-size="13" font-weight="700">CANON RESOLVER</text><path d="M700 202H1065M700 284H1065M700 366H1065" stroke="#D7C9B1" stroke-width="2"/>
<text x="700" y="191" fill="#3C5365" font-size="16" font-weight="700">Evidence present?</text><text x="1038" y="191" fill="#2A806C" font-size="16" font-weight="700" text-anchor="end">PROVISIONAL / ACTIVE</text>
<text x="700" y="273" fill="#3C5365" font-size="16" font-weight="700">Competing active events?</text><text x="1038" y="273" fill="#AA5B25" font-size="16" font-weight="700" text-anchor="end">CONFLICT → ESCALATE</text>
<text x="700" y="355" fill="#3C5365" font-size="16" font-weight="700">Revoked or expired?</text><text x="1038" y="355" fill="#9C3C58" font-size="16" font-weight="700" text-anchor="end">NO CURRENT EVIDENCE</text>
<rect x="700" y="405" width="366" height="48" rx="24" fill="#243247"/><text x="883" y="436" fill="#F7F1E7" font-size="16" font-weight="700" text-anchor="middle">EXPLAINABLE CANON OUTCOME</text></g>
</svg>
